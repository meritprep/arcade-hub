<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metro Dash — Arcade Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:system-ui, sans-serif;text-align:center;padding:20px}main{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a,.btn{color:#fff;background:#7468ff;border:0;border-radius:10px;padding:10px 15px;text-decoration:none;font-weight:800;cursor:pointer}.stats{display:flex;justify-content:center;gap:24px;color:#b9b9d4;margin:12px}.stats b{color:#fff}.stage{position:relative;overflow:hidden;height:min(70vh,520px);min-height:390px;background:linear-gradient(#171c3a,#0b0c18);border:2px solid #363967;border-radius:18px;margin:15px auto;touch-action:none}.sky{height:38%;background:linear-gradient(#252c59,#151a38);position:relative}.moon{position:absolute;right:12%;top:18%;font-size:42px}.city{height:20%;background:repeating-linear-gradient(90deg,#20264a 0 34px,#161b37 34px 62px);border-bottom:8px solid #2d315d}.track{position:absolute;inset:58% 0 0;background:repeating-linear-gradient(90deg,#171827 0 31%,#454b76 32% 33%,#171827 34% 64%,#454b76 65% 66%,#171827 67%);perspective:300px}.track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 35px,#7780ba55 36px 39px);transform:perspective(300px) rotateX(45deg);transform-origin:top}.runner,.item{position:absolute;z-index:3;transition:left .12s}.runner{bottom:13%;left:calc(50% - 24px);font-size:44px;filter:drop-shadow(0 4px 2px #0008)}.item{font-size:28px;top:-45px}.barrier{font-size:35px}.message{position:absolute;inset:0;z-index:5;background:#080914d9;display:grid;place-content:center;gap:12px;font-size:20px}.hidden{display:none}.controls{display:flex;justify-content:center;gap:14px}.controls button{width:90px;height:50px;font-size:24px}.help{color:#999bb8;font-size:13px}
</style>
</head>
<body><main><div class="top"><h1>🚇 Metro Dash</h1><a href="../index.html">Arcade Hub</a></div><p class="help">An original lane-running game. No Subway Surfers names, characters, art, music, or code.</p><div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Coins <b id="coins">0</b></span></div><section class="stage" id="stage"><div class="sky"><span class="moon">🌙</span></div><div class="city"></div><div class="track"></div><div class="runner" id="runner">🏃</div><div class="message" id="message"><strong>Dash through the metro!</strong><button class="btn" id="start">Start game</button><small>Arrow keys, A/D, swipe, or buttons</small></div></section><div class="controls"><button class="btn" id="left">←</button><button class="btn" id="right">→</button></div><p class="help">Collect coins and shields. Avoid barriers. The pace increases as your score grows.</p></main>
<script>
const stage=document.querySelector('#stage'),runner=document.querySelector('#runner'),message=document.querySelector('#message'),scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),bestEl=document.querySelector('#best');let lane=1,score=0,coins=0,items=[],running=false,last=0,spawnAt=0,speed=180,shield=0,swipeX=0;bestEl.textContent=localStorage.metroDashBest||0;
function setLane(n){lane=Math.max(0,Math.min(2,n));runner.style.left=(lane*33.333+14)+'%'}function move(n){if(running)setLane(lane+n)}
function start(){items.forEach(x=>x.remove());items=[];lane=1;score=coins=0;shield=0;speed=180;running=true;message.classList.add('hidden');scoreEl.textContent=0;coinsEl.textContent=0;setLane(1);last=performance.now();spawnAt=last+500;requestAnimationFrame(loop)}
function spawn(){let el=document.createElement('span'),type=Math.random()<.18?'🛡️':Math.random()<.56?'🪙':'🚧';el.className='item '+(type==='🚧'?'barrier':'');el.textContent=type;el.dataset.lane=Math.floor(Math.random()*3);el.style.left=(Number(el.dataset.lane)*33.333+14)+'%';el.style.top='-45px';stage.append(el);items.push(el)}
function end(){running=false;let old=Number(localStorage.metroDashBest||0);if(score>old){localStorage.metroDashBest=score;bestEl.textContent=score}message.querySelector('strong').textContent='Run over — score '+score;message.querySelector('small').textContent='Tap start to try again';message.classList.remove('hidden')}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;score+=Math.floor(dt*10);scoreEl.textContent=score;speed=180+Math.min(230,score*.8);if(now>spawnAt){spawn();spawnAt=now+Math.max(330,900-score*2)}items.forEach((el,i)=>{let top=el.offsetTop+speed*dt;el.style.top=top+'px';if(top>stage.clientHeight){el.remove();items.splice(i,1);return}if(top>stage.clientHeight*.68&&top<stage.clientHeight*.82&&Number(el.dataset.lane)===lane){if(el.textContent==='🪙'){coins++;coinsEl.textContent=coins;el.remove()}else if(el.textContent==='🛡️'){shield=1;el.remove()}else if(shield){shield=0;el.remove();runner.textContent='✨'}else end()}});if(running)requestAnimationFrame(loop)}
start.onclick=start;left.onclick=()=>move(-1);right.onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' '&&!running)start()});stage.addEventListener('pointerdown',e=>swipeX=e.clientX);stage.addEventListener('pointerup',e=>{let d=e.clientX-swipeX;if(Math.abs(d)>25)move(d>0?1:-1)});
</script></body></html>
